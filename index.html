<html style="display:block; height:100%; margin:0; padding:0">
    <head>
        <title>Clock</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#000001"/>
        <meta name="google" content="notranslate">
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="shortcut icon" href="favicon.ico" />
        <script src="pwa.js" defer></script>
        <link rel="manifest" href="manifest.json">
        <style type="text/css">
            /* Customizable font and colors */
            html {
                background: #000000;
            }
            body {
                display: table;
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
            }
            /* Clock container styles */
            #clock-container {
                display: table-cell;
                width: 100%;
                height: 100%;
                text-align: center;
                vertical-align: middle;
            }
            #clocktext {
                font-family: sans-serif;
                font-weight: bold;
                color: #D0D0D0;
                white-space: nowrap;
            }
        </style>
    </head>

    <body>
        <div id="clock-container">
            <span id="clocktext" style="font-size:24pt; font-kerning:none"></span>
        </div>

        <script type="text/javascript">
            const textElem = document.getElementById("clocktext");
            const textNode = document.createTextNode("");
            textElem.appendChild(textNode);

            let curFontSize = 16; // Default font size
            let wakeLock = null; // Variable to store the wake lock reference
            
            async function requestWakeLock() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            // Browsers/OS can release wake lock unexpectedly (power saving, tab state, etc.).
                            // Reacquire when the page is visible so the clock remains kiosk-friendly.
                            if (document.visibilityState === 'visible') {
                                requestWakeLock();
                            }
                        });
                        console.log('Wake Lock acquired');
                    } else {
                        console.log('Wake Lock not available');
                    }
                } catch (err) {
                    console.error('Failed to acquire wake lock:', err);
                }
            }

            function releaseWakeLock() {
                if (wakeLock) {
                    wakeLock.release();
                    wakeLock = null;
                    console.log('Wake Lock released');
                }
            }

            function updateClock() {
                const d = new Date();
                let s = "";
                s += ((d.getHours() + 11) % 12 + 1) + ":";
                s += (10 > d.getMinutes() ? "0" : "") + d.getMinutes() + ":";
                s += (10 > d.getSeconds() ? "0" : "") + d.getSeconds() + "\u00A0";
                s += d.getHours() >= 12 ? "pm" : "am";
                textNode.data = s;
                setTimeout(updateClock, 1000 - d.getTime() % 1000 + 100);
            }

            function updateTextSize() {
                const targetWidth = 0.9; // Proportion of full screen width
                const widthPadding = 16; // Safety margin in px
                const heightPadding = 8; // Safety margin in px
                const minFontSize = 6; // Lower bound in points
                const maxFontSize = 400; // Upper bound in points
                let iterationLimit = 10; // Safety cap
                let threshold = 0.5; // Minimum change in font size
                let newFontSize;

                const availableWidth = Math.max(0, window.innerWidth - widthPadding);
                const availableHeight = Math.max(0, window.innerHeight - heightPadding);
                const baseWidth = Math.max(availableWidth, 1);

                do {
                    newFontSize = (baseWidth * targetWidth / textElem.offsetWidth) * curFontSize;
                    newFontSize = Math.max(minFontSize, Math.min(maxFontSize, newFontSize));
                    textElem.style.fontSize = newFontSize.toFixed(3) + "pt";
                    const delta = Math.abs(newFontSize - curFontSize);
                    curFontSize = newFontSize;
                    if (delta < threshold) break;
                } while (--iterationLimit > 0);

                // Hard-fit pass for very small windows: keep shrinking until text fully fits.
                while (
                    curFontSize > minFontSize &&
                    (textElem.scrollWidth > availableWidth || textElem.scrollHeight > availableHeight)
                ) {
                    curFontSize = Math.max(minFontSize, curFontSize - 0.5);
                    textElem.style.fontSize = curFontSize.toFixed(3) + "pt";
                }
            }

            updateClock();
            updateTextSize();

            // Request wake lock when the page loads
            window.addEventListener('load', () => {
                requestWakeLock();
            });

            // Release wake lock when the page unloads
            window.addEventListener('beforeunload', () => {
                releaseWakeLock();
            });

            window.addEventListener("resize", () => {
                updateTextSize();
            });

            window.addEventListener("orientationchange", () => {
                updateTextSize();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                } else {
                    releaseWakeLock();
                }
            });

        </script>
    </body>
</html>
