<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName clock.ati-live.com
    DocumentRoot /var/www/html/clock
    <Directory /var/www/html/clock>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>
    RedirectMatch 302 ^/clock/?$ /
    RedirectMatch 302 ^/clock/(.*)$ /$1
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    ErrorLog ${APACHE_LOG_DIR}/clock-error.log
    CustomLog ${APACHE_LOG_DIR}/clock-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key
</VirtualHost>
</IfModule>
